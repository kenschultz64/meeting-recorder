<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GoGospelNow.com Meeting Recorder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .speaker-0 { color: #0d6efd; } .speaker-1 { color: #198754; }
    .speaker-2 { color: #dc3545; } .speaker-3 { color: #6f42c1; }
    .speaker-4 { color: #fd7e14; } .speaker-5 { color: #20c997; }
    .speaker-6 { color: #6610f2; } .speaker-7 { color: #d63384; }
    .seg { margin-bottom: .4rem; }
    .ts { font-size: .75rem; color: #6c757d; cursor: pointer; }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">🎙️ GoGospelNow.com Meeting Recorder</span>
    <div class="d-flex gap-3 text-white-50 small">
      {% if user.is_authenticated %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'meeting_new' %}">New meeting</a>
        {% if user.is_superuser %}<a class="btn btn-sm btn-outline-light" href="{% url 'user_list' %}">Users</a>{% endif %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'docs_guide' %}">📖 Docs</a>
        <a class="btn btn-sm btn-outline-light" href="{% url 'change_password' %}">Password</a>
        <span>{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
          <button class="btn btn-sm btn-link text-white-50">Sign out</button></form>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% if messages %}{% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
  {% endfor %}{% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
