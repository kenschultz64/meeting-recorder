{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card"><div class="card-body">
<h5 class="card-title">Change password</h5>
<form method="post">{% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
    </div>
  {% endfor %}
  <button class="btn btn-primary">Change password</button>
  <a class="btn btn-outline-secondary" href="{% url 'meeting_list' %}">Cancel</a>
</form>
</div></div>
</div></div>
<script>
document.querySelectorAll('input[type=password]').forEach(i => i.classList.add('form-control'));
</script>
{% endblock %}
