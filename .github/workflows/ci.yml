name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-production-checks-123456789
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_COOKIES: "1"
      CELERY_TASK_ALWAYS_EAGER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --require-hashes --requirement requirements.lock
      - run: python manage.py check
      - run: python manage.py test meetings
      - run: bash -n install.sh
      - run: python -m compileall -q config meetings scripts
