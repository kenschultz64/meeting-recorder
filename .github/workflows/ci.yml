name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-production-checks-123456789
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_COOKIES: "1"
      CELERY_TASK_ALWAYS_EAGER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --require-hashes --requirement requirements.lock
      - run: python manage.py check
      - run: python manage.py test meetings
      - run: bash -n install.sh
      - run: python -m compileall -q config meetings scripts
